name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: disruption
          POSTGRES_PASSWORD: disruption
          POSTGRES_DB: disruption
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disruption" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://disruption:disruption@localhost:5432/disruption
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff mypy pandas-stubs bandit pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Security scan of the source (bandit)
        run: bandit -q -r disruption_api migrations scripts
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Migrations apply to a real PostgreSQL and roll back
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests on SQLite (in memory)
        run: pytest
      - name: Tests on the real PostgreSQL service
        env:
          TEST_DATABASE_URL: postgresql+psycopg://disruption:disruption@localhost:5432/disruption
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t disruption-api .

  e2e:
    name: end-to-end (docker compose stack)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Create a throwaway API key
        run: |
          KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          echo "::add-mask::$KEY"
          echo "API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "API_KEY_HASHES=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Start API, worker, PostgreSQL and Redis
        run: |
          docker compose up -d --build
          docker compose exec -T api alembic upgrade head
      - name: Smoke test through the real stack
        run: python3 scripts/smoke_e2e.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v
