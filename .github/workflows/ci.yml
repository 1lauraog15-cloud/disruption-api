name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: disruption
          POSTGRES_PASSWORD: disruption
          POSTGRES_DB: disruption
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disruption" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://disruption:disruption@localhost:5432/disruption
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff mypy pandas-stubs
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Migrations apply to a real PostgreSQL and roll back
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests on SQLite (in memory)
        run: pytest
      - name: Tests on the real PostgreSQL service
        env:
          TEST_DATABASE_URL: postgresql+psycopg://disruption:disruption@localhost:5432/disruption
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t disruption-api .
