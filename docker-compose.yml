# Local stack: API + Celery worker + PostgreSQL + Redis.
# Run:  docker compose up --build
# Then: docker compose exec api alembic upgrade head
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: disruption
      POSTGRES_PASSWORD: disruption
      POSTGRES_DB: disruption
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disruption"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://disruption:disruption@db:5432/disruption
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      API_KEY_HASHES: ${API_KEY_HASHES:-}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A disruption_api.celery_app.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://disruption:disruption@db:5432/disruption
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
